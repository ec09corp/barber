    <meta property="og:type" content="website" />
    <meta property="og:title" content="Noir Barber Studio — Precisión, Estilo y Actitud" />

    <!-- Google Fonts: Syne (Display) & Plus Jakarta Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syne:wght@600;700;800&display=swap"

    <!-- Schema.org JSON-LD Structured Data for Barbershop / Local Business -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BarberShop",
        "name": "Noir Barber Studio",
        "image": "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=1200&auto=format&fit=crop",
        "description": "Una barbería moderna que combina cortes clásicos, tendencias contemporáneas y una experiencia premium de autor.",
        "telephone": "+1-555-0199",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Dirección del cliente",
          "addressLocality": "Ciudad",
          "addressCountry": "ES"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "10:00",
            "closes": "20:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "11:00",
            "closes": "16:00"
          }
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Servicios de Barbería",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Skin Fade",
                "description": "Fade realizado con precisión y acabado detallado."

              "price": "15",
              "priceCurrency": "USD"
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Classic Cut",
                "description": "Corte clásico personalizado."
              },
              "price": "12",
              "priceCurrency": "USD"
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "The Noir Experience",
                "description": "Corte, barba, lavado y acabado premium."
              },
              "price": "30",
              "priceCurrency": "USD"
            }
          ]
        }
      }
    </script>
